[Paths]
src_dir = C:\Shinseikai\MEGATransfer\target
uploaded_dir = C:\Shinseikai\MEGATransfer\uploaded

[filename]
# 転送するファイル名のパターン（拡張子を除いたファイル名の末尾）。.env の同名キーのURLへ転送する
Taskdiary_pattern = _taskdiary
Receive_file_pattern = _magnate

[App]
# ファイル書き込み完了を待つ時間（秒）
wait_time = 0.5
# 最後のファイル検知から処理を開始するまでの待機時間（秒）
batch_delay = 3.0
# アップロード済みファイルを保管先に残す時間（時間）
uploaded_retention_hours = 4

[Uploader]
# 同名ファイルがある場合に表示される上書きボタンのテキスト
replace_button_text = 置き換える
# アップロード応答の最大待機時間（秒）
max_wait_time = 60
# ヘッドレスモードで実行するかどうか
headless = True
# アップロード完了後の待機時間（秒）
post_upload_wait = 1.0

[LOGGING]
log_retention_days = 7
log_directory = logs
log_level = INFO
debug_mode = True
project_name = MEGATransfer